{% extends 'base.html' %}
{% block content %}
<h1>Extraction <span class="highlight">Knowledge</span></h1>
<form action="{{ url_for('result') }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="myTextarea">Pengetahuan dalam bahasa Indonesia</label>
  <p>Maksimal 10.000 karakter dan 100 kalimat.</p>
  <div class="textarea-container">
    <textarea name="text" id="myTextarea" maxlength="10000" required placeholder="Ketik pengetahuan yang Anda miliki di sini"></textarea>
  </div>
  <div class="button-container-page1">
    <button type="submit">Proses</button>
    <a href="{{ url_for('result') }}">Result</a>
  </div>
</form>
{% endblock %}
