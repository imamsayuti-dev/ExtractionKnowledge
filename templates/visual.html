{% extends 'base.html' %}
{% block title %}Data Visualization{% endblock %}
{% block content %}
<h1>Data Visualization</h1>
{% include '_filter.html' %}
<div id="chart-container" aria-label="Jumlah hasil ekstraksi per kategori">
  {% for category, count in counts.items() %}
    <div class="chart-row">
      <label for="bar-{{ loop.index }}">{{ category }}</label>
      <meter id="bar-{{ loop.index }}" min="0" max="{{ maximum }}" value="{{ count }}">{{ count }}</meter>
      <span>{{ count }}</span>
    </div>
  {% else %}
    <p>Belum ada hasil untuk kategori ini.</p>
  {% endfor %}
</div>
<div class="button-container-page2"><a href="{{ url_for('result', category=selected_category) }}">Kembali</a></div>
{% endblock %}
